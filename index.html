<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фонд Света — Помощь храмам</title>
    <meta name="description" content="Фонд Света. Мы не строим храмы. Мы храним свет, который в них горит.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: #f0e6d8;
            --gold: #e8c87a;
            --gold-bright: #f5d98a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Manrope", system-ui, -apple-system, sans-serif;
            background: #000;
            color: var(--text);
            cursor: crosshair;
            min-height: 100vh;
            min-height: 100svh;
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 9000;
            pointer-events: none;
            opacity: 0.045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 9001;
            pointer-events: none;
            opacity: 0.3;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0.12) 4px
            );
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 9002;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        }

        .glow {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, rgba(232, 200, 122, 0.12) 0%, transparent 60%);
        }

        .bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: rgba(15, 10, 8, 0.78);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 5;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4vh;
            padding: 5vh 20px 12vh;
        }

        .logo {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(232, 200, 122, 0.4));
            animation: logoFade 1.6s ease forwards;
            opacity: 0;
        }

        @keyframes logoFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .title-block {
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.6s;
        }

        .title {
            font-family: "Cinzel", serif;
            font-weight: 600;
            font-size: clamp(28px, 5.5vw, 60px);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text);
            padding: 20px 50px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(30, 22, 16, 0.95), rgba(15, 10, 8, 1));
            border: 1px solid rgba(232, 200, 122, 0.35);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 60px rgba(232, 200, 122, 0.15);
            text-shadow: 0 0 30px rgba(232, 200, 122, 0.5), 0 2px 10px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-family: "Cinzel", serif;
            font-size: clamp(12px, 1.6vw, 16px);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-top: 20px;
            text-shadow: 0 0 20px rgba(232, 200, 122, 0.5);
        }

        .mission {
            max-width: 750px;
            text-align: center;
            font-size: clamp(15px, 2.2vw, 22px);
            line-height: 1.7;
            color: #e8dcc8;
            background: rgba(25, 18, 12, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 32px 44px;
            border-radius: 18px;
            border: 1px solid rgba(232, 200, 122, 0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.9s;
            font-style: italic;
            position: relative;
        }

        .mission::before,
        .mission::after {
            content: "✦";
            color: var(--gold);
            position: absolute;
            font-size: 18px;
            text-shadow: 0 0 15px rgba(232, 200, 122, 0.8);
        }

        .mission::before {
            top: 12px;
            left: 20px;
        }

        .mission::after {
            bottom: 12px;
            right: 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.3s;
        }

        .btn {
            display: inline-block;
            padding: 20px 40px;
            font-family: "Cinzel", serif;
            font-size: clamp(13px, 1.6vw, 16px);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            border-radius: 14px;
            text-align: center;
            background: linear-gradient(145deg, rgba(30, 22, 16, 0.98), rgba(15, 10, 8, 1));
            border: 1px solid rgba(232, 200, 122, 0.35);
            box-shadow:
                0 8px 24px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            min-width: 200px;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            background: linear-gradient(145deg, rgba(45, 32, 20, 1), rgba(25, 15, 10, 1));
            border-color: rgba(245, 217, 138, 0.7);
            box-shadow:
                0 14px 36px rgba(0,0,0,0.7),
                0 0 40px rgba(232, 200, 122, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.15);
            color: var(--gold-bright);
        }

        .btn.primary {
            background: linear-gradient(145deg, rgba(60, 42, 20, 1), rgba(40, 26, 12, 1));
            border-color: rgba(245, 217, 138, 0.55);
            color: var(--gold-bright);
            text-shadow: 0 0 15px rgba(232, 200, 122, 0.5);
        }

        .btn.primary:hover {
            background: linear-gradient(145deg, rgba(80, 58, 28, 1), rgba(55, 38, 18, 1));
            box-shadow:
                0 14px 36px rgba(0,0,0,0.7),
                0 0 50px rgba(245, 217, 138, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .signature {
            position: fixed;
            bottom: 18px;
            left: 22px;
            z-index: 9100;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(120, 90, 75, 0.7);
            pointer-events: none;
        }

        .managed {
            position: fixed;
            bottom: 18px;
            right: 22px;
            z-index: 9100;
            font-family: "Cinzel", serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(232, 200, 122, 0.5);
            pointer-events: none;
            text-shadow: 0 0 15px rgba(232, 200, 122, 0.3);
            text-align: right;
            max-width: 40vw;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .page {
                padding: 5vh 16px 14vh;
                gap: 3vh;
            }

            .logo {
                max-width: 150px;
                max-height: 150px;
            }

            .title {
                font-size: clamp(22px, 7vw, 30px);
                letter-spacing: 0.12em;
                padding: 14px 24px;
            }

            .subtitle {
                font-size: 10px;
                letter-spacing: 0.2em;
                margin-top: 12px;
            }

            .mission {
                font-size: 14px;
                padding: 22px 22px;
                max-width: 96%;
                line-height: 1.65;
                border-radius: 14px;
            }

            .mission::before { top: 8px; left: 12px; font-size: 14px; }
            .mission::after { bottom: 8px; right: 12px; font-size: 14px; }

            .buttons {
                flex-direction: column;
                gap: 12px;
                width: 100%;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 340px;
                padding: 16px 24px;
                font-size: 13px;
                min-width: auto;
                letter-spacing: 0.1em;
            }

            .signature {
                bottom: 10px;
                left: 12px;
                font-size: 10px;
            }

            .managed {
                bottom: 10px;
                right: 12px;
                font-size: 9px;
                letter-spacing: 0.1em;
                max-width: 50vw;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .page {
                padding: 3vh 20px 8vh;
                gap: 2vh;
            }

            .logo {
                max-width: 100px;
                max-height: 100px;
            }

            .title {
                font-size: 22px;
                padding: 12px 28px;
            }

            .mission {
                font-size: 13px;
                padding: 14px 22px;
            }

            .btn {
                padding: 12px 28px;
                font-size: 12px;
            }

            .signature,
            .managed {
                display: none;
            }
        }
    </style>
</head>
<body>

    <img src="Фон.png" alt="" class="bg">
    <div class="overlay"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glow"></div>

    <div class="page">
        <img src="LogoFond.png" alt="Фонд Света" class="logo">

        <div class="title-block">
            <h1 class="title">Фонд Света</h1>
            <div class="subtitle">Помощь храмам</div>
        </div>

        <div class="mission">
            Мы не строим храмы.<br>
            Мы храним свет, который в них горит.
        </div>

        <div class="buttons">
            <a href="help.html" class="btn primary">Помочь</a>
            <a href="about.html" class="btn">О фонде</a>
            <a href="video.html" class="btn">Дневник</a>
        </div>
    </div>

    <div class="signature">ReedGnir</div>
    <div class="managed">Под управлением Теневого Контура</div>

</body>
</html>

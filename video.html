<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Видеотека — Фонд Света</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
            font-family: "Manrope", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 9000;
            pointer-events: none;
            opacity: 0.045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 9001;
            pointer-events: none;
            opacity: 0.3;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0.12) 4px
            );
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 9002;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        }

        .bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: rgba(15, 10, 8, 0.85);
            pointer-events: none;
        }

        .glow {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(circle at 50% 30%, rgba(232, 200, 122, 0.15) 0%, transparent 60%);
        }

        .page {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 800px;
            padding: 6vh 24px 12vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4vh;
        }

        .logo {
            max-width: 160px;
            max-height: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(232, 200, 122, 0.5));
            animation: logoFade 1.5s ease forwards;
            opacity: 0;
        }

        @keyframes logoFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .header {
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.4s;
        }

        .title {
            font-family: "Cinzel", serif;
            font-weight: 600;
            font-size: clamp(28px, 7vw, 48px);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #f0e6d8;
            padding: 18px 40px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(30, 22, 16, 0.98), rgba(15, 10, 8, 1));
            border: 1px solid rgba(232, 200, 122, 0.35);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 60px rgba(232, 200, 122, 0.15);
            text-shadow: 0 0 30px rgba(232, 200, 122, 0.5);
        }

        .subtitle {
            font-family: "Cinzel", serif;
            font-size: clamp(11px, 2.5vw, 14px);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #e8c87a;
            margin-top: 14px;
            text-shadow: 0 0 20px rgba(232, 200, 122, 0.5);
        }

        .videos {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.8s;
        }

        .loader,
        .empty {
            text-align: center;
            padding: 40px 20px;
            font-family: "Cinzel", serif;
            font-size: 15px;
            letter-spacing: 0.12em;
            color: #d4c4b0;
            text-transform: uppercase;
        }

        .empty {
            font-family: "Manrope", sans-serif;
            text-transform: none;
            letter-spacing: 0.04em;
            font-size: 14px;
            line-height: 1.6;
        }

        .video-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px 28px;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(30, 22, 16, 0.98), rgba(15, 10, 8, 1));
            border: 1px solid rgba(232, 200, 122, 0.3);
            box-shadow:
                0 8px 24px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.06);
            text-decoration: none;
            color: #f0e6d8;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .video-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(232, 200, 122, 0.08) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .video-card:hover::before {
            opacity: 1;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: rgba(232, 200, 122, 0.65);
            box-shadow:
                0 14px 36px rgba(0,0,0,0.7),
                0 0 40px rgba(232, 200, 122, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .video-number {
            font-family: "Cinzel", serif;
            font-size: 32px;
            font-weight: 700;
            color: #e8c87a;
            min-width: 60px;
            text-align: center;
            text-shadow: 0 0 20px rgba(232, 200, 122, 0.6);
            flex-shrink: 0;
        }

        .video-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        .video-name {
            font-family: "Cinzel", serif;
            font-size: clamp(15px, 3.5vw, 19px);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #f0e6d8;
        }

        .video-desc {
            font-size: clamp(12px, 2.8vw, 14px);
            color: #a89680;
            letter-spacing: 0.02em;
        }

        .video-arrow {
            font-size: 22px;
            color: #e8c87a;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            text-shadow: 0 0 15px rgba(232, 200, 122, 0.5);
        }

        .video-card:hover .video-arrow {
            transform: translateX(6px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 2vh;
            padding: 14px 36px;
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #f0e6d8;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(30, 22, 16, 0.98), rgba(15, 10, 8, 1));
            border: 1px solid rgba(232, 200, 122, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.2s;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(232, 200, 122, 0.6);
            box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 30px rgba(232, 200, 122, 0.2);
        }

        .managed {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Cinzel", serif;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(232, 200, 122, 0.4);
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .page {
                padding: 5vh 16px 12vh;
                gap: 3vh;
            }

            .logo {
                max-width: 120px;
                max-height: 120px;
            }

            .title {
                font-size: clamp(22px, 7vw, 32px);
                padding: 14px 26px;
            }

            .video-card {
                padding: 18px 20px;
                gap: 14px;
            }

            .video-number {
                font-size: 26px;
                min-width: 46px;
            }

            .video-arrow {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <img src="Фон.png" alt="" class="bg">
    <div class="overlay"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glow"></div>

    <div class="page">
        <img src="LogoFond.png" alt="Фонд Света" class="logo">

        <div class="header">
            <div class="title">Видеотека</div>
            <div class="subtitle">Фонд Света · Дневник создания</div>
        </div>

        <div class="videos" id="videos">
            <div class="loader">Загрузка видео…</div>
        </div>

        <a href="index.html" class="back-btn">← На главную</a>
    </div>

    <div class="managed">Под управлением Теневого Контура</div>

    <script>
        /* ===== НАСТРОЙКИ РЕПОЗИТОРИЯ ===== */
        const USERNAME = 'RTVSW';
        const REPO = 'FondSveta';
        const FOLDER = 'videos';
        /* ================================== */

        const videosEl = document.getElementById('videos');

        /* Преобразует имя файла в читаемое название:
           "01-День-1-Я-создаю-фонд.html" → "День 1. Я создаю фонд" */
        function prettyName(filename) {
            let name = filename.replace(/\.html?$/i, '');
            name = name.replace(/^\d+[-_\s]*/, '');
            name = name.replace(/[-_]+/g, ' ');
            name = name.replace(/(\d+)\s+/, '$1. ');
            return name;
        }

        /* Извлекает номер из имени файла */
        function extractNumber(filename) {
            const match = filename.match(/^(\d+)/);
            return match ? parseInt(match[1], 10) : 9999;
        }

        async function loadVideos() {
            try {
                const api = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER}`;
                const res = await fetch(api);

                if (!res.ok) throw new Error('Ошибка загрузки');

                const files = await res.json();

                const htmlFiles = files
                    .filter(f => f.type === 'file' && /\.html?$/i.test(f.name))
                    .filter(f => f.name.toLowerCase() !== 'index.html')
                    .sort((a, b) => extractNumber(a.name) - extractNumber(b.name));

                videosEl.innerHTML = '';

                if (htmlFiles.length === 0) {
                    videosEl.innerHTML = '<div class="empty">Пока нет видео.<br>Загрузите HTML-файлы в папку videos/ на GitHub.</div>';
                    return;
                }

                htmlFiles.forEach((file, i) => {
                    const num = extractNumber(file.name);
                    const displayNum = num === 9999 ? String(i + 1).padStart(2, '0') : String(num).padStart(2, '0');
                    const title = prettyName(file.name);

                    const card = document.createElement('a');
                    card.className = 'video-card';
                    card.href = FOLDER + '/' + file.name;

                    card.innerHTML = `
                        <div class="video-number">${displayNum}</div>
                        <div class="video-info">
                            <div class="video-name">${title}</div>
                            <div class="video-desc">Нажмите, чтобы посмотреть</div>
                        </div>
                        <div class="video-arrow">→</div>
                    `;

                    videosEl.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                videosEl.innerHTML = '<div class="empty">Ошибка загрузки.<br>Проверьте настройки репозитория.</div>';
            }
        }

        loadVideos();
    </script>

</body>
</html>
